<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
        }
        tr {
            display: flex;
            width: 100%;
            height: 100%;
        }
        td {
            flex: 1;
            border: 1px solid black;
            padding: 10px;
            font-size: 20px;
        }
        .cell-one {
            background-color: #90EE90;
        }
        .cell-two {
            background-color: #ADD8E6;
        }
        @media screen and (max-width: 600px) {
            tr {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cell-one">First cell</td>
            <td class="cell-two">Second cell</td>
        </tr>
    </table>
</body>
</html>
