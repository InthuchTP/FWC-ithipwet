<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            height: 150px;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            border: 1px solid black;
            text-align: left;
            vertical-align: top;
            padding: 10px;
            font-size: 20px;
        }
        .cell-one {
            background-color: #90EE90;
        }
        .cell-two {
            background-color: #ADD8E6;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="cell-one">First cell</td>
            <td class="cell-two">Second cell</td>
        </tr>
    </table>
</body>
</html>
